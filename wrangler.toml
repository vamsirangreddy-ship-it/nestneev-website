name = "nestneev-website"
compatibility_date = "2026-09-21"

# worker.js serves dist/ for everything except POST /api/enquiry (the
# contact + sell-property forms), which it handles itself by emailing
# the submission via Resend. See worker.js for full setup notes.
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[vars]
# Not sensitive — just where enquiry emails get sent. The Resend API
# key itself is a secret (wrangler secret put RESEND_API_KEY), never here.
CONTACT_TO_EMAIL = "hello@nestneev.com"
CONTACT_PHONE_DISPLAY = "+91 98XXX XXXXX"
