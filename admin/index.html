<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NestNeev Content Admin</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS). Login is handled by the GitHub
       backend configured in config.yml, via the cms-auth-worker Cloudflare
       Worker — no separate identity widget needed. -->
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>

  <!-- bulk-upload: Decap's media library only ever uploads the FIRST file you
       pick (its file input has no "multiple" and its handler does files[0]),
       so adding 10 photos meant 10 separate trips through the dialog. This
       lets the file picker select many files at once and then feeds them to
       Decap's own uploader one after another, with a small progress note.
       It only wraps Decap's existing single-file upload; nothing else changes. -->
  <script>
  (function () {
    var busy = false, note = null;

    // 1) Let the OS file picker select several files.
    function enableMultiple() {
      var inputs = document.querySelectorAll(".nc-fileUploadButton input[type=file]");
      for (var i = 0; i < inputs.length; i++) { if (!inputs[i].multiple) inputs[i].multiple = true; }
    }
    enableMultiple();
    new MutationObserver(enableMultiple).observe(document.documentElement, { childList: true, subtree: true });

    // 2) Small floating progress note.
    function say(text, done) {
      if (!note) {
        note = document.createElement("div");
        note.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:99999;background:#0B2545;color:#fff;" +
          "padding:10px 16px;border-radius:8px;font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);";
        document.body.appendChild(note);
      }
      note.textContent = text;
      note.style.display = "block";
      if (done) setTimeout(function () { if (note) note.style.display = "none"; }, 5000);
    }

    // Decap clears the input's value once a file has finished uploading.
    function waitUntilCleared(input) {
      return new Promise(function (resolve) {
        var waited = 0;
        (function poll() {
          if (!input.files || input.files.length === 0 || waited > 120000) return resolve();
          waited += 300; setTimeout(poll, 300);
        })();
      });
    }

    async function uploadOneByOne(input, files) {
      busy = true;
      try {
        for (var i = 0; i < files.length; i++) {
          say("Uploading photo " + (i + 1) + " of " + files.length + "… please keep this page open");
          var dt = new DataTransfer();
          dt.items.add(files[i]);
          input.files = dt.files;
          var ev = new Event("change", { bubbles: true });
          ev.__bulkReplay = true;
          input.dispatchEvent(ev);
          await waitUntilCleared(input);
        }
        say("All " + files.length + " photos uploaded. Now tick the ones you want and click Choose selected.", true);
      } catch (e) {
        say("Upload stopped: " + (e && e.message ? e.message : e), true);
      } finally {
        busy = false;
      }
    }

    // Capture phase so we run before Decap's own handler.
    document.addEventListener("change", function (e) {
      var input = e.target;
      if (!input || input.type !== "file" || !input.closest || !input.closest(".nc-fileUploadButton")) return;
      if (e.__bulkReplay) return;                       // our own one-file replay: let Decap handle it
      var files = Array.prototype.slice.call(input.files || []);
      if (files.length < 2) return;                      // single file: normal behaviour
      e.stopImmediatePropagation();
      e.stopPropagation();
      if (busy) return;
      uploadOneByOne(input, files);
    }, true);
  })();
  </script>
</body>
</html>
